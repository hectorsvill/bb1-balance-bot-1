<!doctype html>
<!-- BB1 todo page, served by tools/todo.py serve. Reads and writes only through the JSON API
     on the same server (/api/...), so whatever this page does, an agent can do too.
     The todos themselves live in the Obsidian vault (BB1 - Roadmap.md); this page never stores any. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BB1 Todo</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6e6e73; --line:#d8d8dc; --card:#fff; --accent:#0a64d6; --hot:#c62828; --good:#2e7d32; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151517; --fg:#ececf0; --muted:#9a9aa2; --line:#33333a; --card:#1e1e22; --accent:#5ea2ff; --hot:#ff6b6b; --good:#66bb6a; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; } h2 { font-size:16px; margin:0 0 8px; } h3 { font-size:14px; margin:8px 0 4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; overflow-x:auto; }
  input, button, select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  button { cursor:pointer; } a { color:var(--accent); }
  code { font-family:ui-monospace, monospace; font-size:12px; background:color-mix(in srgb, var(--muted) 15%, transparent); padding:0 3px; border-radius:3px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); } .err { color:var(--hot); } .good { color:var(--good); }
  /* status strip: one small box per fact; a fact that failed shows why, in grey */
  #status { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:8px; }
  .fact { border:1px solid var(--line); border-radius:6px; padding:6px 8px; min-width:0; }
  .fact b { display:block; font-size:12px; color:var(--muted); font-weight:600; }
  .fact div { overflow:hidden; text-overflow:ellipsis; }
  /* progress bar: done / total */
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; flex:1; min-width:80px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .bar.full i { background:var(--good); }
  .head { display:flex; gap:10px; align-items:center; margin-bottom:6px; }
  .head h2 { margin:0; flex:0 1 auto; } .count { color:var(--muted); white-space:nowrap; }
  ul.todos { list-style:none; margin:0; padding:0; }
  ul.todos li { display:flex; gap:8px; align-items:flex-start; padding:3px 0; }
  ul.todos li input { margin-top:3px; padding:0; }
  ul.todos li.done span { color:var(--muted); text-decoration:line-through; }
  ul.todos li.sub { padding-left:24px; }
  details summary { cursor:pointer; color:var(--muted); margin-top:4px; }
  #focus ul { margin:0 0 4px; padding-left:20px; }
  #msg { min-height:1.4em; }
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between"><h1>BB1 todo</h1>
    <span class="row"><span id="msg" class="muted"></span><button id="reload">Reload</button></span></div>

  <div class="card"><div id="status" class="muted">Loading status&hellip;</div></div>

  <div class="card">
    <div class="head"><h2>All milestones</h2><div class="bar" id="allbar"></div><span class="count" id="allcount"></span></div>
    <p class="muted" id="phase" style="margin:4px 0 0"></p>
  </div>

  <div class="card" id="focus"></div>
  <div id="sections"></div>

  <div class="card">
    <h2>Add a todo</h2>
    <div class="row">
      <select id="addsec"></select>
      <input id="addtext" size="50" placeholder="what needs doing">
      <button id="add">Add</button>
    </div>
    <p class="muted" style="margin:6px 0 0">Goes to the end of that section in <code>BB1 - Roadmap.md</code>; Obsidian Git commits it.</p>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);

async function api(path, body) {
  const opt = body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt); const j = await r.json();
  if (!j.ok) throw new Error(j.error); return j;
}
function esc(v) { return String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// Just enough Markdown for one roadmap line: `code`, **bold**, [[note|label]] -> label. Escape first, so no HTML gets in.
function md(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\[\[([^\]|]+)\|?([^\]]*)\]\]/g, (_, a, b) => b || a);
}
function bar(done, total) {
  const pct = total ? Math.round(100 * done / total) : 0;
  return `<div class="bar${done === total ? " full" : ""}"><i style="width:${pct}%"></i></div>`;
}
function say(text, bad) { $("msg").className = bad ? "err" : "muted"; $("msg").textContent = text; }

async function loadTodos() {
  let j;
  try { j = await api("/api/todos"); } catch (e) { $("sections").innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  $("allbar").outerHTML = bar(j.done, j.total).replace('class="bar', 'id="allbar" class="bar');
  $("allcount").textContent = `${j.done} / ${j.total} done`;
  $("phase").innerHTML = md(j.focus.phase || "");
  const groups = Object.entries(j.focus.groups || {});
  $("focus").innerHTML = "<h2>Focus (Dashboard)</h2>" + (groups.length
    ? groups.map(([g, items]) => `<h3>${esc(g)}</h3><ul>${items.map(i => `<li>${md(i)}</li>`).join("")}</ul>`).join("")
    : `<p class="muted">${esc(j.focus.error || "no Now / Next / Later found")}</p>`);
  // Sections with open todos first (in file order), finished ones after. Inside each: open first.
  const order = [...j.sections].sort((a, b) => (a.done === a.total) - (b.done === b.total));
  $("sections").innerHTML = order.map((s, k) => {
    const open = s.items.filter(i => !i.done), done = s.items.filter(i => i.done);
    const li = i => `<li class="${i.done ? "done" : ""}${i.indent ? " sub" : ""}"><input type="checkbox" data-id="${i.id}" data-k="${k}"
      ${i.done ? "checked" : ""}><span>${md(i.text)}</span></li>`;
    return `<div class="card"><div class="head"><h2>${md(s.title)}</h2>${bar(s.done, s.total)}
      <span class="count">${s.done} / ${s.total}</span></div>
      <ul class="todos">${open.map(li).join("")}</ul>
      ${done.length ? `<details><summary>${done.length} done</summary><ul class="todos">${done.map(li).join("")}</ul></details>` : ""}</div>`;
  }).join("");
  $("sections").querySelectorAll("input[type=checkbox]").forEach(box => box.onchange = () => tick(box, order));
  const keep = $("addsec").value;
  $("addsec").innerHTML = j.sections.map(s => `<option>${esc(s.title)}</option>`).join("");
  if (keep) $("addsec").value = keep;
}

// Send the line exactly as we saw it: the server refuses if the file changed since.
async function tick(box, order) {
  const item = order[box.dataset.k].items.find(i => i.id === box.dataset.id);
  box.disabled = true;
  try {
    await api(box.checked ? "/api/done" : "/api/undo", {id: item.id, line: item.raw});
    say(`${box.checked ? "Done" : "Reopened"}: ${item.text}`);
  } catch (e) { say(e.message, true); }
  loadTodos();
}

async function addTodo() {
  const text = $("addtext").value.trim(); if (!text) return;
  try { await api("/api/add", {section: $("addsec").value, text}); $("addtext").value = ""; say("Added: " + text); }
  catch (e) { say(e.message, true); }
  loadTodos();
}

async function loadStatus() {
  let j;
  try { j = await api("/api/status"); } catch (e) { $("status").innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
  const fact = (title, f, show) => `<div class="fact"><b>${title}</b>${f.ok ? show(f) : `<div class="muted" title="${esc(f.error)}">n/a: ${esc(f.error)}</div>`}</div>`;
  const ci = r => r.status !== "completed" ? `<span class="muted">${esc(r.status)}</span>`
    : `<span class="${r.conclusion === "success" ? "good" : "err"}">${esc(r.conclusion)}</span>`;
  $("status").className = "";
  $("status").innerHTML = [
    fact("Firmware on BB1 (last flash)", j.firmware, f => `<div>${esc(f.last_flash.version)} <span class="muted">${esc(f.last_flash.build_id)}</span></div>
      <div class="muted">${esc(f.last_flash.time)}, ${esc(f.last_flash.method)}, ${esc(f.last_flash.result)}</div>`),
    fact("Runs logged", j.runs, f => `<div>${f.runs} runs, ${f.armed_min} min armed</div><div class="muted">last ${esc(f.last_run)}</div>`),
    fact("Git", j.git, f => `<div>on <code>${esc(f.branch)}</code></div><div class="muted" title="${esc(f.branches.join(" "))}">${f.branches.length} branches: ${esc(f.branches.join(", "))}</div>`),
    fact("Open PRs", j.prs, f => f.prs.length ? f.prs.map(p => `<div><a href="${esc(p.url)}" target="_blank">#${p.number}</a> ${esc(p.title)}${p.isDraft ? " (draft)" : ""}</div>`).join("") : `<div class="muted">none</div>`),
    fact("CI (last 3)", j.ci, f => f.runs.map(r => `<div><a href="${esc(r.url)}" target="_blank">${ci(r)}</a> <code>${esc(r.headBranch)}</code> <span class="muted">${esc(r.displayTitle)}</span></div>`).join("")),
  ].join("");
}

$("reload").onclick = () => { say(""); loadTodos(); loadStatus(); };
$("add").onclick = addTodo; $("addtext").onkeydown = e => e.key === "Enter" && addTodo();
loadTodos(); loadStatus();
</script>
</body>
</html>
